<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>客服售前售后经营工作台</title>
  <link rel="stylesheet" href="../after-sales.css?v=20260824-20">
</head>
<body>
  <header class="hero">
    <div class="brand"><span class="logo">A</span><div><h1>客服售前售后经营工作台</h1><p>售前转化、服务效率、产品问题、赔偿与退货退款</p><small id="dataStatus">数据加载中…</small></div></div>
    <button id="themeBtn" class="ghost">深色模式</button>
  </header>

  <main>
    <div class="workspace-switch" aria-label="工作台切换">
      <button data-workspace="weekly" class="active">上周复盘</button>
      <button data-workspace="pre">售前经营</button>
      <button data-workspace="after">售后分析</button>
      <button data-workspace="returns">退货退款分析</button>
    </div>

    <section id="preSalesWorkspace" hidden>
      <section class="filters pre-filters panel">
        <label>开始周期<select id="preStart"></select></label>
        <span class="arrow">→</span>
        <label>结束周期<select id="preEnd"></select></label>
        <label>平台<select id="prePlatform"></select></label>
        <label>店铺<select id="preShop"></select></label>
        <div class="period-switch" aria-label="售前趋势粒度">
          <button data-pre-grain="month" class="active">月度趋势</button><button data-pre-grain="week">最近4周</button>
        </div>
        <div class="pre-scope"><span>当前分析范围</span><strong id="preScope"></strong></div>
      </section>
      <nav class="pre-tabs" aria-label="售前分析模块">
        <button data-pre-page="analysis" class="active">售前经营分析</button>
        <button data-pre-page="audit">数据质量</button>
      </nav>
      <section id="preKpis" class="kpis"></section>
      <section id="preDashboardBody"></section>
    </section>

    <section id="weeklyReviewWorkspace">
      <section id="weeklyReviewBody"></section>
    </section>

    <section id="afterSalesWorkspace" hidden>
    <section class="filters panel">
      <label>运营一级大类<div id="cat1Combo" class="combo"></div></label>
      <span class="arrow">›</span>
      <label>运营二级品类<div id="cat2Combo" class="combo"></div></label>
      <span class="arrow">›</span>
      <label>具体问题<select id="issueSelect"></select></label>
      <div class="period-switch" aria-label="趋势粒度">
        <button data-grain="month" class="active">月度趋势</button><button data-grain="week">最近4周</button>
      </div>
      <label>时间范围<select id="rangeSelect"></select></label>
    </section>

    <nav class="tabs" aria-label="分析模块">
      <button data-module="cause" class="active">售后原因分析</button>
      <button data-module="rate">品类售后负担</button>
      <button data-module="comp">赔偿分析</button>
      <button data-module="action">行动清单</button>
    </nav>

    <section id="kpis" class="kpis"></section>
    <section id="dashboardBody"></section>
    </section>

    <section id="returnRefundWorkspace" hidden>
      <section class="filters return-filters panel">
        <label>开始周期<select id="returnStart"></select></label>
        <span class="arrow">→</span>
        <label>结束周期<select id="returnEnd"></select></label>
        <label>运营一级大类<div id="returnCat1Combo" class="combo"></div></label>
        <span class="arrow">›</span>
        <label>运营二级品类<div id="returnCat2Combo" class="combo"></div></label>
        <div class="period-switch" aria-label="退货退款趋势粒度">
          <button data-return-grain="month" class="active">月度趋势</button><button data-return-grain="week">最近4周</button>
        </div>
        <div id="returnScope" class="pre-scope"></div>
      </section>
      <section id="returnKpis" class="return-kpis"></section>
      <section id="returnDashboardBody"></section>
    </section>
  </main>

  <div id="tooltip" class="tooltip" role="tooltip"></div>
  <script src="../data/pre-sales-data.js?v=20260821-12"></script>
  <script src="../data/return-refund-summary-data.js?v=20260824-20"></script>
  <script src="../dashboard-modal.js?v=20260824-20"></script>
  <script src="../weekly-review.js?v=20260824-20"></script>
  <script src="../pre-sales.js?v=20260824-20"></script>
</body>
</html>
